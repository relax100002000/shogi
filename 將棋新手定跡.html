<style>
/* Layout: strategy chips on top; board (kaya wood) left, study notes + kifu right; stacks on phones */
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --ink:#1E2320; --muted:#5D655F; --line:#D3D8D1;
  --accent:#2C4A78; --accent-soft:#DCE4F0; --sente:#1E2320; --promo:#B3261E;
  --kaya:#E2BE76; --kaya2:#D6AE62; --grid:#5A4220; --piece:#F4E3BC; --piece-edge:#B98E4C; --hl:rgba(44,74,120,.28);
  --f-piece:"Shippori Mincho B1","Noto Serif TC","Hiragino Mincho ProN",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171B; --surface:#1C2026; --ink:#E7E9E4; --muted:#9AA19B; --line:#2E343B;
  --accent:#8FB0E3; --accent-soft:#25324A; --promo:#FF8A80;
  --kaya:#C9A35E; --kaya2:#B88F4C; --grid:#3E2C12; --piece:#EFDDB2; --piece-edge:#8E6A33; --hl:rgba(30,60,120,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171B; --surface:#1C2026; --ink:#E7E9E4; --muted:#9AA19B; --line:#2E343B;
  --accent:#8FB0E3; --accent-soft:#25324A; --promo:#FF8A80;
  --kaya:#C9A35E; --kaya2:#B88F4C; --grid:#3E2C12; --piece:#EFDDB2; --piece-edge:#8E6A33; --hl:rgba(30,60,120,.38); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-piece);font-weight:800;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:16px 24px}
.group{display:flex;flex-direction:column;gap:6px}
.group-label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.group-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;display:flex;align-items:baseline;gap:8px}
.chip small{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.chip:focus-visible,.ctrl:focus-visible,.mv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.boardcol{display:flex;flex-direction:column;gap:10px;align-items:center}
.hand{width:100%;max-width:460px;display:flex;align-items:center;gap:8px;min-height:34px;font-size:13px;color:var(--muted)}
.hand .who{font-weight:700;color:var(--ink);white-space:nowrap}
.hand .pcs{display:flex;flex-wrap:wrap;gap:6px}
.hp{font-family:var(--f-piece);font-weight:800;font-size:17px;color:#2A1D0A;background:var(--piece);border:1px solid var(--piece-edge);border-radius:4px;padding:0 6px}
.hp sub{font-family:var(--f-body);font-size:11px;font-weight:500}
.boardframe{width:100%;max-width:460px;display:grid;grid-template-columns:1fr 22px;grid-template-rows:20px auto;gap:2px}
.files{grid-column:1;display:grid;grid-template-columns:repeat(9,1fr);text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ranks{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(9,1fr);font-size:12px;color:var(--muted);align-items:center;justify-items:center}
.board{grid-column:1;grid-row:2;aspect-ratio:10/11;max-width:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  background:linear-gradient(160deg,var(--kaya),var(--kaya2));border:2px solid var(--grid);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sq{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.sq:nth-child(9n){border-right:0}.sq:nth-child(n+73){border-bottom:0}
.sq.from{background:rgba(255,255,255,.18)}
.sq.to{background:var(--hl)}
.pc{width:82%;height:88%;background:var(--piece);clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);display:flex;align-items:center;justify-content:center;

.pc.g{transform:rotate(180deg)}
.pc.p{color:#B3261E}
.pc.two{font-size:clamp(10px,3vw,15px);writing-mode:vertical-rl;letter-spacing:-.05em}
.controls{display:flex;gap:8px;align-items:center;width:100%;max-width:460px}
.ctrl{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:44px;height:40px;font-size:15px}
.ctrl:disabled{opacity:.4;cursor:default}
.controls input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.notes{display:flex;flex-direction:column;gap:16px;min-width:0}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title-row h2{font-family:var(--f-piece);font-weight:800;font-size:28px;margin:0}
.kana{color:var(--muted);font-size:13px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.summary{margin:0}
.points{margin:0;padding-left:1.2em;color:var(--muted);font-size:14px}
.now{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;min-height:84px}
.now .mvname{font-family:var(--f-piece);font-weight:800;font-size:22px}
.now p{margin:4px 0 0}
.now .empty{color:var(--muted)}
.kifu-label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.kifu{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;max-height:260px;overflow:auto;padding:2px;position:relative}
.mv{font:inherit;font-size:14px;text-align:left;cursor:pointer;border:0;background:transparent;color:var(--ink);padding:3px 6px;border-radius:4px;font-variant-numeric:tabular-nums;display:flex;gap:6px}
.mv .n{color:var(--muted);font-size:12px;min-width:1.6em;text-align:right;padding-top:2px}
.mv.has-c::after{content:"•";color:var(--accent)}
.mv[aria-current="true"]{background:var(--accent);color:var(--bg)}
.mv[aria-current="true"] .n{color:var(--bg)}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>

    <p>選一個戰法，逐手播放。矢倉系的攻法會直接從城堡組好的局面開始。藍點的手有解說；鍵盤左右鍵也能換手。</p>

        <button class="ctrl" id="last" aria-label="最後一手">⏭</button>

      <div class="counter" id="counter"></div>

    <div class="notes">

      <ul class="points" id="points"></ul>

</div>

function buildChips(){
